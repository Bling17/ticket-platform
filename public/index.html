<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketmaster</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">Ticketmaster</div>
        <nav>
            <a href="#">Concerts</a>
            <a href="#">Sports</a>
            <a href="#">Arts, Theater & Comedy</a>
            <a href="#">Family</a>
        </nav>
        <div class="nav-links" id="nav-links-container">
            <a href="#" id="nav-my-tickets">My Tickets</a>
            <a href="#" id="nav-signin-btn">Sign In/Register</a>
        </div>
    </header>

    <div class="tm-search-container">
        <div class="tm-search-bar">
            <input type="text" placeholder="Location (City or Zip Code)" class="search-field" style="flex: 0.8;">
            <input type="text" placeholder="All Dates" class="search-field" style="flex: 0.6;">
            <input type="text" id="search-input" placeholder="Artist, Event or Venue (Try BTS or Rock)" class="search-field" style="flex: 1.5;">
            <button id="search-btn">Search</button>
        </div>
    </div>

    <main class="main-content" style="padding: 40px; background-color: #121212; min-height: 100vh;">

        <!-- The Dynamic Event Grid -->
        <div class="tm-event-grid" id="dynamic-event-grid">
            <!-- JavaScript will draw the events here -->
        </div>

        <!-- The Interactive Ticketing Engine -->
        <div id="ticket-purchasing" class="hidden" style="color: white;">
            <button id="back-btn" style="margin-bottom: 20px; padding: 8px 15px; cursor: pointer;">← Back to Events</button>
            <h2 id="venue-name" style="margin-bottom: 20px;">Event Venue</h2>
            <div id="seat-map" style="background-color: #1a1a1f; padding: 30px; border-radius: 8px;">
                <!-- JavaScript will draw seats here -->
            </div>
        </div>

<!-- My Tickets Wallet -->
    <div id="my-tickets-section" class="hidden" style="color: white; margin-top: 20px; padding: 0 60px;">
        <button id="wallet-back-btn" style="background: #333; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin-bottom: 20px; font-weight: bold;">← Back to Events</button>
        <h2>My Digital Wallet</h2>
        <!-- JavaScript will dynamically load your ticket cards here -->
    </div>

        <!-- The Transfer Modal Popup -->
        <div id="transfer-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000;">
            <div style="background: #242429; padding: 40px; border-radius: 8px; width: 450px; text-align: center;">
                <h3 style="color: white; margin-top: 0; margin-bottom: 20px;">Transfer Ticket Details</h3>
                
                <!-- NEW: Sender Name Input -->
                <input type="text" id="transfer-sender-name" placeholder="Your Name (e.g. Rowland Joshua)" style="width: 90%; padding: 12px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #444; outline: none; background: #121212; color: white;">

                <input type="text" id="transfer-event-name" placeholder="Event Name (e.g. BTS World Tour)" style="width: 90%; padding: 12px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #444; outline: none; background: #121212; color: white;">
                
                <input type="text" id="transfer-seat-info" placeholder="Seat Info (e.g. VIP, Row A, Seat 4)" style="width: 90%; padding: 12px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #444; outline: none; background: #121212; color: white;">

                <input type="email" id="friend-email" placeholder="Recipient's Email Address" style="width: 90%; padding: 12px; margin-bottom: 25px; border-radius: 4px; border: none; outline: none;">
                
                <button id="submit-transfer-btn" style="background: #4CAF50; color: white; border: none; padding: 12px 30px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 90%;">Send Ticket Securely</button>
                <p id="close-modal-btn" style="color: #999; margin-top: 20px; cursor: pointer; text-decoration: underline;">Cancel</p>
                <p id="transfer-message" style="margin-top: 15px; font-weight: bold;"></p>
            </div>
        </div>
    </main>
<!-- Authentication Modal Popup -->
    <div id="auth-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 2000;">
        <div style="background: #242429; padding: 40px; border-radius: 8px; width: 400px; text-align: center; color: white; position: relative;">
            <h3 id="auth-title" style="margin-top: 0; margin-bottom: 20px;">Sign In to MyuzeTix</h3>
            
            <!-- Name Input (Only used for Registration) -->
            <input type="text" id="auth-name" placeholder="Full Name" class="hidden" style="width: 90%; padding: 12px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #444; background: #121212; color: white; outline: none;">
            
            <input type="email" id="auth-email" placeholder="Email Address" style="width: 90%; padding: 12px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #444; background: #121212; color: white; outline: none;">
            
            <input type="password" id="auth-password" placeholder="Password" style="width: 90%; padding: 12px; margin-bottom: 25px; border-radius: 4px; border: 1px solid #444; background: #121212; color: white; outline: none;">
            
            <button id="auth-submit-btn" style="background: #026cdf; color: white; border: none; padding: 12px 30px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 90%;">Sign In</button>
            
            <p id="auth-toggle-text" style="margin-top: 20px; font-size: 14px; color: #aaa; cursor: pointer;">
                Don't have an account? <span style="color: #026cdf; text-decoration: underline;" id="auth-switch-mode">Register</span>
            </p>
            
            <p id="auth-close-btn" style="color: #777; margin-top: 15px; cursor: pointer; font-size: 13px;">Cancel</p>
            <p id="auth-message" style="margin-top: 15px; font-weight: bold; font-size: 14px;"></p>
        </div>
    </div>

    <!-- Checkout Modal Popup -->
    <div id="checkout-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 2500;">
        <div style="background: #242429; padding: 40px; border-radius: 8px; width: 400px; text-align: center; color: white;">
            <h3 style="margin-top: 0; color: #026cdf;">Complete Your Checkout</h3>
            <p id="checkout-seat-details" style="color: #ccc; margin: 20px 0; font-size: 16px;"></p>
            <p style="font-size: 20px; font-weight: bold; color: #4CAF50; margin-bottom: 25px;">Price: ₦150,000</p>
            
            <button id="confirm-pay-btn" style="background: #4CAF50; color: white; border: none; padding: 12px 30px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 90%;">Pay & Secure Ticket</button>
            <p id="checkout-cancel-btn" style="color: #999; margin-top: 20px; cursor: pointer; text-decoration: underline; font-size: 14px;">Cancel</p>
            <p id="checkout-message" style="margin-top: 15px; font-weight: bold; font-size: 14px;"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
